[workspace]
members = [
    "crates/skylands_app",
    "crates/skylands_core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
macroquad = "0.4.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skylands_core = { path = "crates/skylands_core" }
